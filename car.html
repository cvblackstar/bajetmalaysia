<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Loan Kereta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Kembali ke Menu Utama</a>
            <h1>🚗 Kalkulator Loan Kereta</h1>
            <p>Kira anggaran bayaran bulanan pinjaman kenderaan anda.</p>
        </header>

        <main class="calculator-layout">
            <!-- Bahagian Input -->
            <section class="input-section">
                <div class="form-group">
                    <label for="carPrice">Harga Kereta (RM)</label>
                    <input type="number" id="carPrice" placeholder="Contoh: 80000" value="80000">
                </div>

                <div class="form-group">
                    <label for="downPayment">Muka Depan / Downpayment (RM)</label>
                    <input type="number" id="downPayment" placeholder="Contoh: 8000" value="8000">
                </div>

                <div class="form-group">
                    <label for="interestRate">Kadar Faedah Setahun (%)</label>
                    <input type="number" step="0.01" id="interestRate" placeholder="Contoh: 3.0" value="3.0">
                </div>

                <div class="form-group">
                    <label for="loanDuration">Tempoh Pinjaman (Tahun)</label>
                    <select id="loanDuration">
                        <option value="3">3 Tahun</option>
                        <option value="5">5 Tahun</option>
                        <option value="7" selected>7 Tahun</option>
                        <option value="9">9 Tahun</option>
                    </select>
                </div>

                <button id="calculateBtn" class="btn-primary">Kira Bayaran</button>
            </section>

            <!-- Bahagian Keputusan -->
            <section class="result-section">
                <h2>Ringkasan Pinjaman</h2>
                <div class="result-card">
                    <div class="result-item highlight">
                        <span>Anggaran Bulanan</span>
                        <h3 id="monthlyPayment">RM 0.00</h3>
                    </div>
                    <div class="result-breakdown">
                        <p>Jumlah Pinjaman: <span id="totalLoan">RM 0.00</span></p>
                        <p>Jumlah Faedah Keseluruhan: <span id="totalInterest">RM 0.00</span></p>
                        <p>Jumlah Pembayaran: <span id="totalPayment">RM 0.00</span></p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="car.js"></script>
</body>
</html>
