<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050">
<rect width="1200" height="1050" fill="#f8fbff"/>
<rect x="35" y="30" width="1130" height="150" rx="28" fill="#eaf3ff"/>
<text x="70" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#12345b">Pemaju + Projek =</text>
<text x="70" y="140" font-family="Arial,sans-serif" font-size="48" font-weight="800" fill="#0f8b62">SEMAK DAHULU</text>
<text x="610" y="82" font-family="Arial,sans-serif" font-size="21" fill="#334">Harga dan show unit menarik belum cukup. Semak pemaju, projek,</text>
<text x="610" y="112" font-family="Arial,sans-serif" font-size="21" fill="#334">lesen, tanah dan dokumen sebelum komitmen besar.</text>
<rect x="35" y="210" width="210" height="500" rx="20" fill="#fff" stroke="#d8e3ef" stroke-width="2"/><circle cx="73" cy="250" r="24" fill="#0f8b62"/><text x="73" y="259" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#fff">1</text><text x="107" y="258" font-family="Arial" font-size="20" font-weight="700" fill="#12345b">Semak Pemaju</text><circle cx="60" cy="304" r="9" fill="#0f8b62"/><text x="60" y="309" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="80" y="309" font-family="Arial" font-size="16" fill="#334">Rekod projek terdahulu</text><circle cx="60" cy="360" r="9" fill="#0f8b62"/><text x="60" y="365" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="80" y="365" font-family="Arial" font-size="16" fill="#334">Projek yang telah siap</text><circle cx="60" cy="416" r="9" fill="#0f8b62"/><text x="60" y="421" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="80" y="421" font-family="Arial" font-size="16" fill="#334">Pengurusan kecacatan</text><text x="80" y="443" font-family="Arial" font-size="16" fill="#334">&amp; aduan pembeli</text><circle cx="60" cy="494" r="9" fill="#0f8b62"/><text x="60" y="499" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="80" y="499" font-family="Arial" font-size="16" fill="#334">Struktur syarikat jelas</text>
<rect x="262" y="210" width="210" height="500" rx="20" fill="#fff" stroke="#d8e3ef" stroke-width="2"/><circle cx="300" cy="250" r="24" fill="#0f8b62"/><text x="300" y="259" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#fff">2</text><text x="334" y="258" font-family="Arial" font-size="20" font-weight="700" fill="#12345b">Lesen &amp; Permit</text><circle cx="287" cy="304" r="9" fill="#0f8b62"/><text x="287" y="309" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="307" y="309" font-family="Arial" font-size="16" fill="#334">Lesen pemaju sah</text><circle cx="287" cy="360" r="9" fill="#0f8b62"/><text x="287" y="365" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="307" y="365" font-family="Arial" font-size="16" fill="#334">Permit Iklan &amp; Jualan</text><text x="307" y="387" font-family="Arial" font-size="16" fill="#334">(APDL)</text><circle cx="287" cy="438" r="9" fill="#0f8b62"/><text x="287" y="443" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="307" y="443" font-family="Arial" font-size="16" fill="#334">Semak maklumat rasmi</text><circle cx="287" cy="494" r="9" fill="#0f8b62"/><text x="287" y="499" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="307" y="499" font-family="Arial" font-size="16" fill="#334">Jangan bergantung pada</text><text x="307" y="521" font-family="Arial" font-size="16" fill="#334">brosur sahaja</text>
<rect x="489" y="210" width="210" height="500" rx="20" fill="#fff" stroke="#d8e3ef" stroke-width="2"/><circle cx="527" cy="250" r="24" fill="#0f8b62"/><text x="527" y="259" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#fff">3</text><text x="561" y="258" font-family="Arial" font-size="20" font-weight="700" fill="#12345b">Status Projek</text><circle cx="514" cy="304" r="9" fill="#0f8b62"/><text x="514" y="309" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="534" y="309" font-family="Arial" font-size="16" fill="#334">Kemajuan pembinaan</text><circle cx="514" cy="360" r="9" fill="#0f8b62"/><text x="514" y="365" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="534" y="365" font-family="Arial" font-size="16" fill="#334">Tarikh jangkaan siap</text><circle cx="514" cy="416" r="9" fill="#0f8b62"/><text x="514" y="421" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="534" y="421" font-family="Arial" font-size="16" fill="#334">Semak status sakit /</text><text x="534" y="443" font-family="Arial" font-size="16" fill="#334">terbengkalai</text><circle cx="514" cy="494" r="9" fill="#0f8b62"/><text x="514" y="499" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="534" y="499" font-family="Arial" font-size="16" fill="#334">Bandingkan dengan</text><text x="534" y="521" font-family="Arial" font-size="16" fill="#334">rekod rasmi</text>
<rect x="716" y="210" width="210" height="500" rx="20" fill="#fff" stroke="#d8e3ef" stroke-width="2"/><circle cx="754" cy="250" r="24" fill="#0f8b62"/><text x="754" y="259" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#fff">4</text><text x="788" y="258" font-family="Arial" font-size="20" font-weight="700" fill="#12345b">Semak Tanah</text><circle cx="741" cy="304" r="9" fill="#0f8b62"/><text x="741" y="309" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="761" y="309" font-family="Arial" font-size="16" fill="#334">Pegangan bebas / pajakan</text><circle cx="741" cy="360" r="9" fill="#0f8b62"/><text x="741" y="365" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="761" y="365" font-family="Arial" font-size="16" fill="#334">Tempoh pajakan</text><circle cx="741" cy="416" r="9" fill="#0f8b62"/><text x="741" y="421" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="761" y="421" font-family="Arial" font-size="16" fill="#334">Bebanan / kepentingan</text><circle cx="741" cy="472" r="9" fill="#0f8b62"/><text x="741" y="477" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="761" y="477" font-family="Arial" font-size="16" fill="#334">Semak melalui Pejabat</text><text x="761" y="499" font-family="Arial" font-size="16" fill="#334">Tanah</text>
<rect x="943" y="210" width="210" height="500" rx="20" fill="#fff" stroke="#d8e3ef" stroke-width="2"/><circle cx="981" cy="250" r="24" fill="#0f8b62"/><text x="981" y="259" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#fff">5</text><text x="1015" y="258" font-family="Arial" font-size="20" font-weight="700" fill="#12345b">Baca Dokumen</text><circle cx="968" cy="304" r="9" fill="#0f8b62"/><text x="968" y="309" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="988" y="309" font-family="Arial" font-size="16" fill="#334">Perjanjian Jual Beli</text><text x="988" y="331" font-family="Arial" font-size="16" fill="#334">(SPA)</text><circle cx="968" cy="387" r="9" fill="#0f8b62"/><text x="968" y="392" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="988" y="392" font-family="Arial" font-size="16" fill="#334">Spesifikasi &amp; pelan</text><circle cx="968" cy="443" r="9" fill="#0f8b62"/><text x="968" y="448" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="988" y="448" font-family="Arial" font-size="16" fill="#334">Kos penyelenggaraan</text><circle cx="968" cy="499" r="9" fill="#0f8b62"/><text x="968" y="504" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">✓</text><text x="988" y="504" font-family="Arial" font-size="16" fill="#334">Dapatkan nasihat</text>
<rect x="35" y="735" width="550" height="265" rx="22" fill="#fff1f1" stroke="#e65a5a" stroke-width="2"/><text x="65" y="780" font-family="Arial" font-size="28" font-weight="800" fill="#c83232">RED FLAG — SEMAK LEBIH MENDALAM</text><text x="65" y="825" font-family="Arial" font-size="18" fill="#333">• Pemaju hampir tiada rekod tetapi projek sangat besar</text><text x="65" y="860" font-family="Arial" font-size="18" fill="#333">• Maklumat lesen / projek sukar disahkan</text><text x="65" y="895" font-family="Arial" font-size="18" fill="#333">• Maklumat pemasaran tidak sepadan dengan rekod rasmi</text><text x="65" y="930" font-family="Arial" font-size="18" fill="#333">• Tekanan untuk bayar atau tandatangan dengan tergesa-gesa</text><text x="65" y="970" font-family="Arial" font-size="18" font-weight="700" fill="#12345b">Tiada rekod ≠ rekod buruk. Tetapi ia sebab untuk semak lebih teliti.</text>
<rect x="615" y="735" width="550" height="265" rx="22" fill="#eaf8f2" stroke="#78c7a7" stroke-width="2"/><text x="645" y="780" font-family="Arial" font-size="28" font-weight="800" fill="#0f8b62">SUMBER RASMI</text><text x="645" y="825" font-family="Arial" font-size="19" fill="#333">Gunakan TEDUH / KPKT untuk menyemak:</text><text x="645" y="860" font-family="Arial" font-size="18" fill="#333">• Pemaju dan projek</text><text x="645" y="892" font-family="Arial" font-size="18" fill="#333">• Lesen pemaju dan Permit Iklan &amp; Jualan</text><text x="645" y="924" font-family="Arial" font-size="18" fill="#333">• Status projek yang tersedia</text><text x="645" y="965" font-family="Arial" font-size="17" font-weight="700" fill="#12345b">Due diligence bukan untuk menakutkan pembeli —</text><text x="645" y="990" font-family="Arial" font-size="17" font-weight="700" fill="#12345b">ia membantu membuat keputusan dengan maklumat lengkap.</text>
</svg>